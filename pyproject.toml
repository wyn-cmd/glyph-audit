[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "glyph-audit"
version = "1.0.0"
description = "Report invisible, reordering and confusable characters in text files."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "wyn-cmd" }]

[project.scripts]
glyph-audit = "glyphaudit.cli:main"

[tool.setuptools]
packages = ["glyphaudit"]
